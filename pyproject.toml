[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot"
version = "2.0.0"
description = "Bot de trading en modo pruebas con datos de Binance en tiempo real, backtests y dashboard web"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "httpx>=0.27",
    "websockets>=13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tradingbot = "tradingbot.cli:main"

[tool.setuptools.packages.find]
include = ["tradingbot*"]

[tool.setuptools.package-data]
"tradingbot.web" = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
